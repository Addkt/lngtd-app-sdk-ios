name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The floor fixtures are generated from base.js in the addkt repo. This job is
  # the SDK-side half of the drift gate described in Tools/FloorContract/README.md.
  #
  # It needs a checkout of a private sibling repo, so it is gated on a secret.
  # Without the secret it reports SKIPPED rather than passing quietly — a green
  # tick that proves nothing is worse than a missing one, and the authoritative
  # gate lives in addkt's own CI anyway (that is where base.js changes originate).
  floor-contract:
    name: Floor contract fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk

      # Passed via env rather than interpolated into the command line, so the
      # secret never appears in an argv that could be echoed by set -x.
      - name: Check for addkt access
        id: access
        env:
          ADDKT_READ_TOKEN: ${{ secrets.ADDKT_READ_TOKEN }}
        run: |
          if [ -n "$ADDKT_READ_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out addkt (for base.js)
        if: steps.access.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Addkt/addkt
          token: ${{ secrets.ADDKT_READ_TOKEN }}
          path: addkt
          sparse-checkout: addkt/static/header/v4-zone/src/units
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        if: steps.access.outputs.available == 'true'
        with:
          node-version: '22'

      - name: Assert fixtures match the live web ladder
        if: steps.access.outputs.available == 'true'
        working-directory: sdk
        env:
          LNGTD_BASE_JS: ${{ github.workspace }}/addkt/addkt/static/header/v4-zone/src/units/base.js
        run: |
          test -f "$LNGTD_BASE_JS" || {
            echo "::error::addkt checked out but base.js is missing at $LNGTD_BASE_JS."
            echo "The sparse-checkout path or the file location has changed. Not skipping —"
            echo "this job exists to catch exactly this kind of silent drift."
            exit 1
          }
          node Tools/FloorContract/generate.mjs --check

      - name: Report skip
        if: steps.access.outputs.available != 'true'
        run: |
          echo "::warning::SKIPPED — no ADDKT_READ_TOKEN secret, so base.js is unavailable."
          echo "The floor drift gate did not run. Set the secret, or rely on addkt's CI."

  swift:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pick the newest Xcode the runner image actually ships, rather than naming one.
      #
      # This step used to hardcode /Applications/Xcode_26.app, which does not exist on
      # macos-15. It failed on the first line of the job, so CI never built or tested this
      # package even once — every run was red for a reason unrelated to the code. A version
      # pin that does not exist is worse than no pin.
      - name: Select Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::No Xcode found in /Applications on this runner."
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      # LongitudeCore and LNGTDExceptionShim are Foundation-only, so they build and
      # test on the macOS host in seconds. LongitudeGAM's sources are wrapped in
      # `#if os(iOS)` and its GoogleMobileAds dependency is conditional on iOS, so
      # this compiles it to an empty module rather than failing — which is what keeps
      # the fast loop. The simulator step below is what actually typechecks it.
      - name: swift build (host)
        run: swift build

      - name: swift test (host)
        run: swift test

      # The only builds that compile the iOS targets for real. Without these, the banner
      # wrapper and the Prebid adapter are unverified: nothing in the host suite touches
      # either, because both compile to empty modules on macOS. Five slices in this repo
      # shipped iOS-only compile errors that `swift build` could not see.
      - name: xcodebuild LongitudeGAM (iOS Simulator)
        run: |
          xcodebuild -scheme LongitudeGAM \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build

      # LongitudeAuction is the only target that links Prebid. It is a library product
      # specifically so it has a scheme and can be built here.
      - name: xcodebuild LongitudeAuction (iOS Simulator)
        run: |
          xcodebuild -scheme LongitudeAuction \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build

      # A macOS build that stops compiling LongitudeGAM to an empty module would
      # silently move the host suite off the fast path, so assert the module is still
      # produced rather than trusting it.
      - name: assert the iOS targets still build for the host
        run: |
          set -euo pipefail
          bin=$(swift build --show-bin-path)
          for module in LongitudeGAM LongitudeAuction; do
            test -f "$bin/Modules/$module.swiftmodule" || {
              echo "::error::$module no longer builds for macOS. Its sources must stay"
              echo "wrapped in #if os(iOS), and its iOS-only dependency conditional, so the"
              echo "host test loop keeps working without pulling the ad SDKs."
              exit 1
            }
          done

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging
